  # ---- Reddit (keyless RSS; top-of-day) ----
  # Combined multi-subreddit feed (r/A+B+C) = ONE request, which avoids Reddit's
  # aggressive per-IP rate limit (hitting subreddits separately gets 429'd).
  # Add/remove subreddits with '+'. (.json API is opt-in via `mode: json` but
  # Reddit 403s it without OAuth — RSS is the reliable keyless path.)
  # ONE combined feed (AI + tech) = 1 request. Reddit's per-IP limit reliably
  # allows only ~1 request/run, so do NOT split into multiple reddit sources.
  - id: reddit-ai
    type: reddit
    ref: MachineLearning+LocalLLaMA+OpenAI+artificial+singularity+technology
    name: Reddit (AI/Tech)
    runner: actions
    weight: normal
    enabled: true

  # ---- YouTube channels (keyless channel-RSS; @handle auto-resolved) ----
  - id: yt-latent-space
    type: youtube
    ref: https://www.youtube.com/@LatentSpacePod
    name: Latent Space (YouTube)
    runner: actions
    weight: normal
    enabled: true

