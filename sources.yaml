  # ---- Login-wall sources (Slice-2): fetched LOCALLY via web-access CDP (your
  #      logged-in browser), never in the cloud. The agent fetch step writes
  #      their items into agent-inbox.json; run locally with `--runner agent`.
  #      Requires: Chrome/Edge remote debugging ON + you logged into the site. ----
  - id: x-karpathy
    type: x
    ref: https://x.com/karpathy
    name: Andrej Karpathy (X)
    runner: agent
    weight: lead
    enabled: true

  - id: x-sama
    type: x
    ref: https://x.com/sama
    name: Sam Altman (X)
    runner: agent
    weight: normal
    enabled: true

  - id: x-openai
    type: x
    ref: https://x.com/OpenAI
    name: OpenAI (X)
    runner: agent
    weight: normal
    enabled: false   # OpenAI 官博 RSS 云端已抓，X 上重复，关闭以减少一次抓取

