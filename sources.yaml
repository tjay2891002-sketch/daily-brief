# DailyBrief source list — YOU OWN THIS FILE. Add a source = add a line.
# Slice-0 supports keyless types: rss / blog / atom / youtube (runner=actions).
# Login-wall sources (X, 微信公众号, 小红书) use runner=agent and are added in
# Slice-2 — listed here commented-out so you can see the shape.
#
# Fields: id (unique), type, ref (feed URL / channel), name (display), runner,
#         weight (lead|normal|brief), enabled.
# Seeded vertical: AI / 科技.

sources:
  # ---- RSS / blogs (keyless) ----
