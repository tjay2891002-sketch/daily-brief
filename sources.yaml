    type: rss
    ref: https://simonwillison.net/atom/everything/
    name: Simon Willison
    runner: actions
    weight: lead
    enabled: true

  - id: huggingface-blog
    type: rss
    ref: https://huggingface.co/blog/feed.xml
    name: Hugging Face Blog
    runner: actions
    weight: normal
    enabled: true

  - id: latent-space
